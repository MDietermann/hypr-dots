background {
    monitor =
    color = rgba(2b1e2bee) rgba(3b2a3dee) 120deg
    blur_passes = 2
}

input-field {
    monitor = DP-2
    size = 20%, 5%
    outline_thickness = 3
    inner_color = rgba(0, 0, 0, 0.0)

    outer_color = rgba(f4a3b0ee) rgba(e8c974ee) 45deg
    check_color = rgba(a8d8b9ee) rgba(e8c974ee) 120deg
    fail_color  = rgba(e8738aee) rgba(f4a3b0ee) 40deg

    font_color = rgb(245, 230, 211)
    fade_on_empty = false
    rounding = 15

    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor = DP-2
    text = Hi there, $USER
    color = rgba(f4a3b0ee)
    font_size = 25
    font_family = Noto Sans

    position = 0, 80
    halign = center
    valign = center
}

label {
    monitor = HDMI-A-2
    text = cmd[update:60] echo $TIME
    color = rgba(f4a3b0ee)
    font_size = 50
    font_family = Noto Sans
    position = 0, 0
    halign = center
    valign = center
}
